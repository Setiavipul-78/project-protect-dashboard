<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cars24 · Project Protect — Challan + Road Safety Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --blue:#4736FE; --blued:#2B2098; --mint:#63FFB1; --orange:#FF4F01;
    --bluel:#E3E1FF; --ink:#020618; --muted:#6B6B86; --line:#ECECF4;
    --bg:#F6F6FC; --card:#fff; --amber:#F59E0B;
    --radius:18px; --shadow:0 1px 3px rgba(20,20,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

  /* ---------- NAV ---------- */
  nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 26px;
    background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .logo{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(71,54,254,.35)}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.05}
  .wordmark span{color:var(--blue)}
  .wordmark small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .tabs{flex:1 1 auto;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink);border-color:var(--bluel)}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(71,54,254,.28)}
  .navright{flex:0 0 auto;display:flex;align-items:center;gap:14px}
  .refresh{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.18s}
  .refresh:hover{border-color:var(--blue);color:var(--blue)}
  .refresh svg{width:14px;height:14px}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .dot.live{background:#15A66A;box-shadow:0 0 0 4px rgba(21,166,106,.15);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,166,106,.35)}70%{box-shadow:0 0 0 7px rgba(21,166,106,0)}100%{box-shadow:0 0 0 0 rgba(21,166,106,0)}}
  .synced{font-size:11px;color:var(--muted);font-weight:500}

  /* ---------- HEADER BAND ---------- */
  .band{color:#fff;padding:46px 0 50px;
    background:radial-gradient(circle at 18% 22%, rgba(99,255,177,.42), transparent 46%),
      radial-gradient(circle at 88% 12%, rgba(99,255,177,.18), transparent 40%),
      linear-gradient(115deg,#4736FE,#2B2098)}
  .band .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  .eyebrow{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
  .band h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:10px}
  .band .sub{font-size:15px;max-width:700px;color:rgba(255,255,255,.86)}

  /* ---------- LAYOUT ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  section{padding:42px 0}
  .sectitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* KPI */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .kpi .card{padding:20px 22px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .kpi .value{font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .kpi .value.accent{color:var(--blue)}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* charts */
  .charts{display:grid;gap:20px}
  .charts .row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .chartcard{padding:22px}
  .chartcard h3{font-size:14.5px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
  .chartcard p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .canvas-wrap{position:relative;height:300px}
  .canvas-wrap.tall{height:430px}

  /* table */
  .tablecard{padding:8px 4px 4px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:1020px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:14px 16px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAFAFE}
  td.city{font-weight:700;white-space:nowrap}
  .pbar{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4736FE,#63FFB1)}
  .pval{font-size:12.5px;font-weight:700;color:var(--muted)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .daybadge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
  .daybadge.warn{background:rgba(245,158,11,.16);color:#B45309}
  .poc{font-size:12.5px;white-space:nowrap}
  .nowrap{white-space:nowrap}
  .remark{font-size:12.5px;color:var(--muted);min-width:240px;max-width:320px}

  /* insights */
  .insights{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .insight{padding:18px 20px;display:flex;gap:13px;align-items:flex-start}
  .idot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .insight .it{font-weight:700;font-size:14px;margin-bottom:2px;letter-spacing:-.01em}
  .insight .in{font-size:13px;color:var(--muted)}

  /* ---------- STORY TAB ---------- */
  .hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:8px}
  .hl .card{padding:20px 22px}
  .hl .htag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .hl .htag .d{width:9px;height:9px;border-radius:50%}
  .hl .big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .hl .sm{font-size:12.5px;color:var(--muted);margin-top:4px}
  .timeline{position:relative;padding-left:8px}
  .tlitem{position:relative;display:grid;grid-template-columns:96px 1fr;gap:16px;padding:0 0 4px 0}
  .tldate{text-align:right;font-size:12px;font-weight:600;color:var(--muted);padding-top:16px;white-space:nowrap}
  .tlbody{border-left:2px solid var(--line);padding:14px 0 22px 22px;position:relative}
  .tlbody::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .tlitem:last-child .tlbody{padding-bottom:2px}
  .tlhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
  .tlcity{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .tlchip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bluel);color:var(--blued)}
  .tlchip.prog{background:#E9F9F0;color:#15A66A}
  .tlfield{font-size:13.5px}
  .tlfield b{font-weight:700}
  .tlquote{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:5px;border-left:2px solid var(--bluel);padding-left:10px}
  .tlmeta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .tlmeta .s{font-weight:600}

  /* story editorial */
  .bandstats{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px;color:#fff}
  .bandstats .s .n{font-size:26px;font-weight:800;letter-spacing:-1px}
  .bandstats .s .l{font-size:11.5px;opacity:.85;max-width:170px;margin-top:2px}
  .storywrap section{padding:34px 0;border-top:1px solid var(--line)}
  .storywrap section:first-child{border-top:none;padding-top:10px}
  .prose p{margin-bottom:13px;font-size:15px}
  .prose b{color:var(--blued);font-weight:700}
  .sec2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .subc{color:var(--muted);font-size:14.5px;margin-bottom:20px;max-width:780px}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
  .callout{background:linear-gradient(120deg,#fff,#F3F1FF);border:1px solid var(--bluel)}
  .cap{font-size:12px;color:var(--muted);margin-top:6px}
  .numgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .numgrid .v{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .step .ic{width:42px;height:42px;border-radius:11px;background:var(--bluel);display:flex;align-items:center;justify-content:center;margin-bottom:11px;font-size:23px}
  .step .num{font-size:11px;font-weight:800;color:var(--blue)}
  .step h4{font-size:14px;margin:2px 0 5px;font-weight:700}
  .step p{font-size:12.5px;color:var(--muted)}
  .jtl{position:relative;margin-top:8px;padding-left:26px}
  .jtl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--bluel)}
  .jtl .it{position:relative;margin-bottom:18px}
  .jtl .it:last-child{margin-bottom:0}
  .jtl .it:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--bluel)}
  .jtl .d{font-size:12px;font-weight:700;color:var(--blue)}
  .jtl .t{font-size:14px;font-weight:700}
  .jtl .x{font-size:13px;color:var(--muted)}
  .press{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.18s}
  .pcard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(71,54,254,.12)}
  .pcard .src{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:6px}
  .pcard .h{font-size:13.5px;font-weight:600;line-height:1.4}
  .pcard .go{font-size:12px;color:var(--muted);margin-top:9px;font-weight:600}

  footer{padding:30px 0 50px;text-align:center;color:var(--muted);font-size:12px}

  @media(max-width:900px){
    .charts .row2{grid-template-columns:1fr}
    .insights{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
    .steps{grid-template-columns:repeat(2,1fr)}
    nav{flex-wrap:wrap}
    .band h1{font-size:27px}
    .tlitem{grid-template-columns:64px 1fr;gap:10px}
  }
</style>
</head>

function toPct(v){
  let n=Number(String(v).replace('%','').trim());
  if(isNaN(n)) return 0;
  if(n<=1.0001) n=n*100;
  return Math.round(n);
}
const isDone = v => String(v).trim().toLowerCase()==='done';
function parseDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function daysInStage(s){
  const d=parseDate(s); if(!d) return null;
  const t=new Date();
  return Math.max(0, Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/86400000));
}
function fmtDate(s){ const d=parseDate(s); return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):(s||'—'); }
function statusOf(r){
  const p=toPct(r.progress);
  if(p>=100 || /^live/i.test(r.phase||'')) return 'Live';
  if(/backlog/i.test(r.phase||'')) return 'Backlog';
  const d=daysInStage(r.lastUpdate);
  if(d!==null && d>21) return 'Delayed';
  if(/outreach/i.test(r.phase||'')) return 'Outreach';
  return 'In Progress';
}

      const sig = key==='Road Safety Signages';
      const steps={};
      gates.forEach(g=>{steps[g.gate]={}; g.steps.forEach(s=>{ steps[g.gate][s]= sig? '' : (r[s]||''); });});
      return {
        city:r['City']||'—', phase:r['Current Phase']||'—', progress:r['Progress'],
        permPOC:r['Permission POC']||'', vendorPOC:r['Vendor POC']||'',
        lastUpdate: sig ? (r['ANPR camera installed']||'') : (r['Last update']||''),
        remark: sig ? (r['Electricity & WiFi done']||'') : (r['Remarks']||''),
        expected: sig ? '' : (r['Expected Go Live Date']||''),
        steps
      };
    })};
  }
  const bb=rows.filter(r=>!isSig(r) && (r['Tracker Sheet']||'Challan Billboard')==='Challan Billboard');
  const sg=rows.filter(isSig);
  const programs=[mk(bb,LEGACY_BILLBOARD_GATES,'Challan Billboard','Challan Billboards')];
  if(sg.length) programs.push(mk(sg,LEGACY_SIGNAGE_GATES,'Road Safety Signages','Road Safety Signages'));
  return {programs, updates:[], generatedAt:j.updated, legacy:true};
}

async function loadData(){
  try{
    const res=await fetch(CONFIG.DATA_URL+(CONFIG.DATA_URL.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw 0;
    const doc=normalizeDoc(await res.json());
    if(!doc) throw 0;
    DOC=doc; isLive=true;
  }catch(e){
    DOC=normalizeDoc(SNAPSHOT)||{programs:[],updates:[]}; isLive=false;
  }
  if(!activeKey || (activeKey!==STORY_KEY && !programByKey(activeKey)))
    activeKey=DOC.programs[0] && DOC.programs[0].key;
}

function updateStatus(){
  document.getElementById('statusDot').classList.toggle('live',isLive);
  document.getElementById('statusText').textContent = isLive?'Live':'Snapshot';
  document.getElementById('synced').textContent = '· '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

function renderTabs(){
  const tabs=DOC.programs.map(p=>({key:p.key,label:p.label||p.key}));
  tabs.push({key:STORY_KEY,label:'Story'});
  document.getElementById('tabs').innerHTML=tabs.map(t=>
    `<button type="button" class="tab ${t.key===activeKey?'active':''}" data-tab="${esc(t.key)}">${esc(t.label)}</button>`).join('');
}

/* ===================== RENDER ===================== */

        ${kpi('In Permission',inPerm,'at Gate 1 / Gate 2')}

      </div>
    </section>
    <section>
      <div class="sectitle">Rollout analytics</div>
      <div class="charts">
        <div class="card chartcard">
          <h3>Deployment progress by city</h3><p>Completion % per city, coloured by current status.</p>
          <div class="canvas-wrap tall"><canvas id="cProgress"></canvas></div>
        </div>

          </div>

            <h3>Gate completion</h3><p>Share of this program's gate checklist marked done, network-wide.</p>
            <div class="canvas-wrap"><canvas id="cGate"></canvas></div>
          </div>

      </div>
    </section>
    <section>
      <div class="sectitle">City tracker</div>

        <table>

            <th>City</th><th>Current Phase</th><th>Progress</th><th>Status</th>

const kpi=(l,v,m)=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="meta">${m}</div></div>`;
const kpiAccent=(l,v,m)=>`<div class="card"><div class="label">${l}</div><div class="value accent">${v}</div><div class="meta">${m}</div></div>`;

function rowHtml(r){
  const st=statusOf(r),col=STATUS_COLOR[st],p=toPct(r.progress),d=daysInStage(r.lastUpdate);
  return `<tr>
    <td class="city">${esc(r.city)||'—'}</td>
    <td class="nowrap">${esc(r.phase)||'—'}</td>
    <td class="nowrap"><span class="pbar"><i style="width:${Math.min(p,100)}%"></i></span><span class="pval">${p}%</span></td>
    <td><span class="pill" style="background:${col}33;color:${col}">${st}</span></td>
    <td>${d===null?'<span class="daybadge">—</span>':`<span class="daybadge ${d>21?'warn':''}">${d} d</span>`}</td>
    <td class="poc">${esc(r.permPOC)||'—'}</td>
    <td class="poc">${esc(r.vendorPOC)||'—'}</td>
    <td class="nowrap">${fmtDate(r.lastUpdate)}</td>
    <td class="nowrap">${esc(r.expected)||'—'}</td>
    <td class="remark">${esc(r.remark)||'—'}</td>
  </tr>`;
}

function gateCompletion(rows,prog){
  return (prog.gates||[]).map(g=>{
    let done=0,tot=0;
    rows.forEach(r=>{const cells=(r.steps&&r.steps[g.gate])||{}; g.steps.forEach(s=>{tot++; if(isDone(cells[s])) done++;});});
    return {gate:g.gate, short:g.gate.split(' · ')[0], pct: tot?Math.round(done/tot*100):0};
  });
}

function insightsHtml(rows,prog){
  if(!rows.length) return '<div class="card insight"><div class="in">No data for this program.</div></div>';
  const out=[];
  const live=rows.filter(r=>statusOf(r)==='Live');
  const stale=rows.filter(r=>{const d=daysInStage(r.lastUpdate);return d!==null&&d>21;});
  const avg=Math.round(rows.reduce((a,r)=>a+toPct(r.progress),0)/rows.length);
  const top=rows.filter(r=>statusOf(r)!=='Live').slice().sort((a,b)=>toPct(b.progress)-toPct(a.progress))[0];
  const ph={}; rows.filter(r=>statusOf(r)!=='Live').forEach(r=>ph[r.phase]=(ph[r.phase]||0)+1);
  const bottleneck=Object.entries(ph).sort((a,b)=>b[1]-a[1])[0];
  const gc=gateCompletion(rows,prog).filter(g=>g.pct<100).sort((a,b)=>a.pct-b.pct)[0];
  out.push(insight(STATUS_COLOR['Live'],`${live.length} of ${rows.length} live`,
    live.length?`${live.map(r=>esc(r.city)).join(', ')} ${live.length>1?'are':'is'} fully operational.`:'No city has reached go-live yet.'));
  if(stale.length) out.push(insight(STATUS_COLOR['Delayed'],`${stale.length} ${stale.length>1?'cities':'city'} stale >21 days`,
    `${stale.map(r=>esc(r.city)).join(', ')} ${stale.length>1?'have':'has'} no update in over 21 days.`));
  else out.push(insight(STATUS_COLOR['Live'],'All updates within SLA','Every city was updated within the last 21 days.'));
  if(bottleneck) out.push(insight(STATUS_COLOR['In Progress'],`Bottleneck: ${esc(bottleneck[0])}`,
    `${bottleneck[1]} ${bottleneck[1]>1?'cities are':'city is'} concentrated here. Network avg progress ${avg}%.`));
  if(gc) out.push(insight(STATUS_COLOR['Outreach'],`Lowest gate: ${esc(gc.short)}`,
    `${esc(gc.gate)} is only ${gc.pct}% complete across all cities${top?` · ${esc(top.city)} leads the pipeline at ${toPct(top.progress)}%`:''}.`));
  return out.join('');
}
const insight=(c,t,n)=>`<div class="card insight"><span class="idot" style="background:${c}"></span><div><div class="it">${t}</div><div class="in">${n}</div></div></div>`;

/* ===================== STORY TAB ===================== */
function allRows(){ return DOC.programs.flatMap(p=>p.rows.map(r=>({...r,program:p.label||p.key}))); }

function storyTimeline(){
  // Prefer the real Slack-sourced updates feed; otherwise synthesise from per-city last updates.
  if(DOC.updates && DOC.updates.length){
    return DOC.updates.map(u=>({
      ts:u.ts||u.timestamp||'', city:u.city||u.location||'—', program:u.program||'',
      field:u.field||'', value:u.value||u.newValue||'', evidence:u.evidence||'',
      source:u.source||u.channel||'', confidence:u.confidence
    })).sort((a,b)=>(parseDate(b.ts)||0)-(parseDate(a.ts)||0));
  }
  return allRows().filter(r=>r.lastUpdate).map(r=>({
    ts:r.lastUpdate, city:r.city, program:r.program, field:'Current Phase', value:r.phase,
    evidence:r.remark||'', source:'tracker', confidence:null
  })).sort((a,b)=>(parseDate(b.ts)||0)-(parseDate(a.ts)||0));
}

/* ===================== CHARTS ===================== */
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; }
function buildCharts(rows,prog){
  destroyCharts();
  if(typeof Chart==='undefined'||!rows.length) return;
  Chart.defaults.font.family="'Geist',sans-serif"; Chart.defaults.color='#6B6B86';
  const sorted=rows.slice().sort((a,b)=>toPct(b.progress)-toPct(a.progress));
  charts.progress=new Chart(document.getElementById('cProgress'),{type:'bar',
    data:{labels:sorted.map(r=>r.city),datasets:[{label:'Progress %',data:sorted.map(r=>toPct(r.progress)),
      backgroundColor:sorted.map(r=>STATUS_COLOR[statusOf(r)]),borderRadius:5,borderSkipped:false,maxBarThickness:20}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x}% · ${statusOf(sorted[c.dataIndex])} · ${sorted[c.dataIndex].phase}`}}},
      scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},y:{grid:{display:false}}}}});
  const present=STATUS_ORDER.filter(s=>rows.some(r=>statusOf(r)===s));
  charts.dist=new Chart(document.getElementById('cDist'),{type:'doughnut',
    data:{labels:present,datasets:[{data:present.map(s=>rows.filter(r=>statusOf(r)===s).length),
      backgroundColor:present.map(s=>STATUS_COLOR[s]),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',
      plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',padding:13,boxWidth:8}}}}});
  const gc=gateCompletion(rows,prog);
  charts.gate=new Chart(document.getElementById('cGate'),{type:'bar',
    data:{labels:gc.map(g=>g.short),datasets:[{label:'% items done',data:gc.map(g=>g.pct),
      backgroundColor:gc.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:46}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>gc[c[0].dataIndex].gate,label:c=>` ${c.parsed.y}% of checklist done`}}},
      scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},x:{grid:{display:false}}}}});
}

});

});

/* ===================== INIT ===================== */
document.getElementById('refMin').textContent=Math.round(CONFIG.REFRESH_SECONDS/60);
(async function init(){
  await loadData(); render();
  if(timer) clearInterval(timer);
  timer=setInterval(async()=>{await loadData(); render();}, CONFIG.REFRESH_SECONDS*1000);
})();
