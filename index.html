<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --blue:#4736FE; --blued:#2B2098; --mint:#63FFB1; --orange:#FF4F01;
    --bluel:#E3E1FF; --ink:#020618; --muted:#6B6B86; --line:#ECECF4;
    --bg:#F6F6FC; --card:#fff; --amber:#F59E0B;
    --radius:18px; --shadow:0 1px 3px rgba(20,20,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

  /* NAV */
  nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 26px;
    background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .logo{width:34px;height:34px;border-radius:9px;object-fit:cover;box-shadow:0 2px 8px rgba(71,54,254,.28);transition:transform .18s ease}
  .brand:hover .logo{transform:rotate(-6deg) scale(1.05)}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
  .wordmark .pp{color:var(--muted);font-weight:600}
  .tabs{flex:1 1 auto;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(71,54,254,.28)}
  .navright{flex:0 0 auto;display:flex;align-items:center;gap:12px}
  .refresh{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:.18s}
  .refresh:hover{border-color:var(--blue);color:var(--blue)}
  .refresh svg{width:14px;height:14px}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .dot.live{background:#15A66A;box-shadow:0 0 0 4px rgba(21,166,106,.15);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,166,106,.35)}70%{box-shadow:0 0 0 7px rgba(21,166,106,0)}100%{box-shadow:0 0 0 0 rgba(21,166,106,0)}}
  .synced{font-size:11px;color:var(--muted);font-weight:500}

  /* HERO */
  .hero{color:#fff;padding:40px 0 44px;position:relative;overflow:hidden;
    background:radial-gradient(1100px 460px at 82% -10%, rgba(99,255,177,.20), transparent),
      radial-gradient(circle at 16% 20%, rgba(99,255,177,.30), transparent 42%),
      linear-gradient(115deg,#4736FE,#2B2098)}
  .hero .wrap{position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:30px;font-size:12px;font-weight:600;margin-bottom:15px}
  .hero h1{font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-1.2px;line-height:1.06;max-width:840px}
  .hero h1 em{font-style:normal;color:var(--mint)}
  .hero .lead{font-size:16px;opacity:.9;max-width:700px;margin-top:14px}
  .bandstats{display:flex;flex-wrap:wrap;gap:26px;margin-top:24px}
  .bandstats .s .n{font-size:26px;font-weight:800;letter-spacing:-1px}
  .bandstats .s .l{font-size:11.5px;opacity:.85;max-width:170px;margin-top:2px}

  /* LAYOUT */
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  section{padding:22px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sectitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
  .sec2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .subc{color:var(--muted);font-size:14.5px;margin-bottom:4px;max-width:900px}
  .subc b{color:var(--blued)}

  /* KPI */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .kpi .card{padding:15px 18px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .kpi .value{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
  .kpi .value.accent{color:var(--blue)}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:4px}

  /* charts */
  .charts{display:grid;gap:14px}
  .row2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  .chartcard{padding:16px 18px}
  .chartcard h3{font-size:15px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
  .chartcard p{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .canvas-wrap{position:relative;height:260px}
  .canvas-wrap.tall{height:400px}

  /* insights / city cards */
  .insights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .insight{padding:12px 15px;display:flex;gap:12px;align-items:flex-start}
  .idot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .insight .it{font-weight:700;font-size:14.5px;margin-bottom:2px;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .insight .idate{font-size:11px;color:var(--muted);font-weight:600;flex:0 0 auto}
  .insight .in{font-size:13px;color:var(--muted)}

  /* table */
  .tablecard{padding:8px 4px 4px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:1020px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:9px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAFAFE}
  td.city{font-weight:700;white-space:nowrap}
  .pbar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4736FE,#63FFB1)}
  .pval{font-size:12.5px;font-weight:700;color:var(--muted)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .daybadge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
  .daybadge.warn{background:rgba(245,158,11,.16);color:#B45309}
  .poc{font-size:12.5px;white-space:nowrap}
  .nowrap{white-space:nowrap}
  .remark{font-size:12.5px;color:var(--muted);min-width:240px;max-width:340px}

  /* journeys */
  .journeycard{padding:16px 20px;margin-bottom:12px}
  .journeycard h3{font-size:16px;font-weight:800;margin-bottom:10px}
  .journey{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .jstep{border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-width:118px}
  .jstep .t{font-weight:700;font-size:13.5px}
  .jstep .d{font-size:12px;color:var(--muted);margin-top:2px}
  .jgap{font-size:12px;font-weight:800;color:var(--orange);white-space:nowrap}
  .jnote{font-size:12.5px;color:var(--muted);margin-top:12px}

  /* story editorial */
  .storywrap section{padding:22px 0;border-top:1px solid var(--line)}
  .storywrap section:first-child{border-top:none;padding-top:8px}
  .prose p{margin-bottom:13px;font-size:15px}
  .prose b{color:var(--blued);font-weight:700}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
  .callout{background:linear-gradient(120deg,#fff,#F3F1FF);border:1px solid var(--bluel)}
  .cap{font-size:12px;color:var(--muted);margin-top:6px}
  .numgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .numgrid .v{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .step .ic{width:42px;height:42px;border-radius:11px;background:var(--bluel);display:flex;align-items:center;justify-content:center;margin-bottom:11px;font-size:23px}
  .step .num{font-size:11px;font-weight:800;color:var(--blue)}
  .step h4{font-size:14px;margin:2px 0 5px;font-weight:700}
  .step p{font-size:12.5px;color:var(--muted)}
  .jtl{position:relative;margin-top:8px;padding-left:26px}
  .jtl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--bluel)}
  .jtl .it{position:relative;margin-bottom:13px}
  .jtl .it:last-child{margin-bottom:0}
  .jtl .it:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--bluel)}
  .jtl .d{font-size:12px;font-weight:700;color:var(--blue)}
  .jtl .t{font-size:14px;font-weight:700}
  .jtl .x{font-size:13px;color:var(--muted)}
  .press{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.18s}
  .pcard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(71,54,254,.12)}
  .pcard .src{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:6px}
  .pcard .h{font-size:13.5px;font-weight:600;line-height:1.4}
  .pcard .go{font-size:12px;color:var(--muted);margin-top:9px;font-weight:600}
  .tlmeta{font-size:11px;color:var(--muted);margin-top:6px}

  /* initiatives */
  .initgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .initcard{padding:14px 16px}
  .inithead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .inittitle{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .initnote{font-size:13px;color:var(--muted);margin:6px 0 12px}
  .initmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bluel);color:var(--blued)}

  /* gallery + context */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .gcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);transition:transform .16s ease, box-shadow .16s ease}
  .gcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,20,60,.10)}
  .gcard img{width:100%;height:172px;object-fit:cover;display:block;background:linear-gradient(135deg,#EEF0FF,#E3E1FF)}
  .gcard .cap{font-size:12px;color:var(--muted);padding:9px 13px;line-height:1.4}
  .ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:6px}
  .ctx .b{padding:13px 15px}
  .ctx .b .n{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .ctx .b .t{font-size:12.5px;color:var(--muted);margin-top:3px}
  .storystrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px}
  @media(max-width:700px){.storystrip{grid-template-columns:1fr}}

  footer{padding:30px 0 50px;text-align:center;color:var(--muted);font-size:12px}

  /* ---------- interactivity & motion ---------- */
  .card{transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease}
  .kpi .card:hover,.insight:hover,.initcard:hover,.chartcard:hover,.journeycard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,20,60,.09);border-color:var(--bluel)}
  .insight,.initcard,.kpi .card{cursor:default}
  .tab{position:relative}
  .tab:active{transform:scale(.96)}
  .refresh:active{transform:scale(.96)}
  .refresh svg{transition:transform .5s ease}
  .refresh:hover svg{transform:rotate(180deg)}
  .pbar i{animation:grow .8s cubic-bezier(.4,0,.2,1) both}
  @keyframes grow{from{width:0}}
  #view.anim section{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
  #view.anim section:nth-child(2){animation-delay:.06s}
  #view.anim section:nth-child(3){animation-delay:.12s}
  #view.anim section:nth-child(4){animation-delay:.18s}
  #view.anim section:nth-child(5){animation-delay:.24s}
  #view.anim section:nth-child(n+6){animation-delay:.3s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  @media(max-width:980px){
    .wrap,.hero .wrap{padding-left:18px;padding-right:18px}
  }
  @media(max-width:900px){
    .row2{grid-template-columns:1fr}
    .insights,.grid2,.initgrid{grid-template-columns:1fr}
    .steps{grid-template-columns:repeat(2,1fr)}
    nav{flex-wrap:wrap}
    .hero h1{font-size:clamp(23px,6vw,30px)}
    .canvas-wrap.tall{height:380px}
  }
  @media(max-width:640px){
    nav{gap:10px;padding:10px 14px}
    .wordmark{font-size:15px}

  }

  /* ---------- CHALLAN FUNNEL — ANALYTICS ---------- */
  .fctrls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin:-6px 0 2px}
  .fctrl{display:flex;align-items:center;gap:9px;min-width:0}
  .seglabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;flex:0 0 auto}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{border:none;background:transparent;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;flex:0 0 auto}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(71,54,254,.26)}
  .fasof{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#15A66A;margin-right:5px}
  .fdelta{font-size:12px;font-weight:700;vertical-align:middle}
  .fdelta.up{color:#15A66A}.fdelta.down{color:#FF4F01}

  /* waterfall funnel — centered tapering stages */
  .funnelcard{padding:24px 26px}
  .wfunnel{display:flex;flex-direction:column;align-items:center;gap:4px}
  .wstage{min-width:120px;max-width:100%;height:58px;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,20,60,.12);animation:fgrow .8s cubic-bezier(.4,0,.2,1) both}

  .wstage b{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1}
  .wstage span{font-size:11.5px;font-weight:600;opacity:.92;margin-top:3px}
  .wconv{font-size:12px;color:var(--muted);font-weight:600}
  .wconv .arw{color:var(--orange);font-weight:900;margin-right:4px}
  .reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
  .rchip{text-align:center}
  .rchip .rv{font-size:20px;font-weight:800;color:var(--blued);letter-spacing:-.3px}
  .rchip .rl{font-size:12px;font-weight:600;margin-top:2px}
  .rchip .rp{font-size:11px;color:var(--muted);margin-top:1px}

  /* compliance */
  .complrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .compl{text-align:center}
  .compl .cv{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .compl .cl{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}

  .panel{min-width:0}
  .pfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .seg.sm{padding:2px}
  .seg.sm button{padding:5px 10px;font-size:11.5px}
  .chartcard .pfilters{margin-bottom:12px}
  .srcbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:16px 0 0}
  .srcbar a{color:var(--blue);text-decoration:none}
  .srcbar a:hover{text-decoration:underline}
  /* ---- compact Challan Funnel layout (denser, less scroll; data unchanged) ---- */
  .funnelview section{padding:15px 0}
  .funnelview section:first-child{padding-top:18px}
  .funnelview .sectitle{margin-bottom:9px}
  .funnelview .subc{margin:3px 0 10px;font-size:13px}
  .funnelview .charts{gap:12px}
  .funnelview .row2{gap:12px}
  .funnelview .kpi{gap:10px}
  .funnelview .kpi .card{padding:12px 15px}
  .funnelview .kpi .value{font-size:23px;margin-top:3px}
  .funnelview .kpi .meta{margin-top:2px}
  .funnelview .chartcard{padding:14px 16px}
  .funnelview .chartcard h3{font-size:14px}
  .funnelview .chartcard p{margin-bottom:7px;font-size:12px}
  .funnelview .canvas-wrap{height:225px}
  .funnelview .canvas-wrap.tall{height:315px}
  .funnelview .pfilters{margin-bottom:9px}
  .funnelview .funnelcard{padding:15px 18px}
  .funnelview .wstage{height:44px}
  .funnelview .wstage b{font-size:17px}
  .funnelview .wfunnel{gap:3px}
  .funnelview .reasons{margin-top:13px;padding-top:13px;gap:9px}
  .funnelview .rchip .rv{font-size:18px}
  .funnelview .complrow{margin-top:10px;padding-top:10px}
  .funnelview table.cmp th,.funnelview table.cmp td{padding:7px 11px}
  .funnelview .fnote{margin-top:11px;padding:10px 13px}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .heatmap{display:inline-block;min-width:560px;padding-top:4px}
  .hmrow{display:flex;gap:3px;margin-bottom:3px;align-items:center}
  .hmday{width:34px;flex:0 0 34px;font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding-right:6px}
  .hmcell{width:20px;height:20px;flex:0 0 20px;border-radius:4px}
  .hmhr{width:20px;flex:0 0 20px;font-size:9.5px;color:var(--muted);text-align:center}
  .sevdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  table.cmp{min-width:520px}
  table.cmp th:first-child,table.cmp td.mlabel{text-align:left;font-weight:700}
  table.cmp th:not(:first-child),table.cmp td:not(.mlabel){text-align:right}

  .fnote{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-top:16px;line-height:1.5}
  .fnote b{color:var(--blued)}

function toPct(v){let n=Number(String(v).replace('%','').trim());if(isNaN(n))return 0;if(n<=1.0001)n=n*100;return Math.round(n);}
const isDone=v=>String(v).trim().toLowerCase()==='done';
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
function daysInStage(s){const d=parseDate(s);if(!d)return null;const t=new Date();return Math.max(0,Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/86400000));}
function fmtDate(s){const d=parseDate(s);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):(s||'—');}
function statusOf(r){const p=toPct(r.progress);if(p>=100||/^live/i.test(r.phase||''))return 'Live';if(/backlog/i.test(r.phase||''))return 'Backlog';const d=daysInStage(r.lastUpdate);if(d!==null&&d>21)return 'Delayed';if(/outreach/i.test(r.phase||''))return 'Outreach';return 'In Progress';}
const programByKey=k=>DOC.programs.find(p=>p.key===k);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* merge duplicate city rows entered with different spellings (Bengaluru→Bangalore, Gurugram→Gurgaon…) */
const CITY_ALIAS={gurugram:'Gurgaon',gurgram:'Gurgaon',ggn:'Gurgaon',bengaluru:'Bangalore',bangaluru:'Bangalore',blr:'Bangalore',bengalore:'Bangalore','new delhi':'Delhi','delhi ncr':'Delhi',ahemdabad:'Ahmedabad',amdavad:'Ahmedabad',bombay:'Mumbai',calcutta:'Kolkata',madras:'Chennai'};
const canonCity=c=>CITY_ALIAS[String(c||'').toLowerCase().trim()]||String(c||'').trim();
function dedupCities(rows){
  const seen={},out=[];
  (rows||[]).forEach(r=>{const key=canonCity(r.city).toLowerCase();if(!key)return;
    const nr=Object.assign({},r,{city:canonCity(r.city)});
    if(seen[key]===undefined){seen[key]=out.length;out.push(nr);}
    else if(toPct(r.progress)>toPct(out[seen[key]].progress)){out[seen[key]]=nr;}});
  return out;
}
function normalizeDoc(j){
  if(j&&Array.isArray(j.programs)&&j.programs.length&&Array.isArray(j.programs[0].rows))
    return {programs:j.programs.map(p=>Object.assign({},p,{rows:dedupCities(p.rows)})),updates:j.updates||[],initiatives:j.initiatives||[],generatedAt:j.generatedAt,funnel:j.funnel};
  if(j&&Array.isArray(j.headers)&&Array.isArray(j.rows)) return legacyToDoc(j);
  return null;
}
function legacyToDoc(j){
  const rows=j.rows, isSig=r=>/road safety/i.test(r['Tracker Sheet']||'')||r['Testing live']==='Road Safety Signages';
  function mk(rf,gates,key,label){return {key,label,gates,rows:rf.map(r=>{const sig=key==='Road Safety Signages';const steps={};gates.forEach(g=>{steps[g.gate]={};g.steps.forEach(s=>{steps[g.gate][s]=sig?'':(r[s]||'');});});return {city:r['City']||'—',phase:r['Current Phase']||'—',progress:r['Progress'],permPOC:r['Permission POC']||'',vendorPOC:r['Vendor POC']||'',lastUpdate:sig?(r['ANPR camera installed']||''):(r['Last update']||''),remark:sig?(r['Electricity & WiFi done']||''):(r['Remarks']||''),expected:sig?'':(r['Expected Go Live Date']||''),steps};})};}
  const bb=rows.filter(r=>!isSig(r)&&(r['Tracker Sheet']||'Challan Billboard')==='Challan Billboard'), sg=rows.filter(isSig);
  const programs=[mk(bb,LEGACY_BILLBOARD_GATES,'Challan Billboard','Challan Billboards')];
  if(sg.length) programs.push(mk(sg,LEGACY_SIGNAGE_GATES,'Road Safety Signages','Road Safety Signages'));
  return {programs,updates:[],initiatives:[],generatedAt:j.updated};
}
async function loadData(){
  try{
    const res=await fetch(CONFIG.DATA_URL+(CONFIG.DATA_URL.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw 0;const doc=normalizeDoc(await res.json());if(!doc)throw 0;DOC=doc;isLive=true;
  }catch(e){DOC=normalizeDoc(SNAPSHOT)||{programs:[],updates:[],initiatives:[]};isLive=false;}
  fillGates(DOC.programs);
  if(!activeKey||(activeKey!==STORY_KEY&&activeKey!==OTHER_KEY&&activeKey!==FUNNEL_KEY&&!programByKey(activeKey)))
    activeKey=DOC.programs[0]&&DOC.programs[0].key;
}
/* if a gate's final step is Done, treat the whole gate as complete (earlier steps auto-Done) */
function fillGates(programs){
  (programs||[]).forEach(p=>(p.rows||[]).forEach(r=>{
    (p.gates||[]).forEach(g=>{
      const cells=r.steps&&r.steps[g.gate]; if(!cells||!g.steps||!g.steps.length) return;
      if(isDone(cells[g.steps[g.steps.length-1]])) g.steps.forEach(s=>{cells[s]='Done';});
    });
  }));
}

/* animate KPI numbers from 0 → value */
function countUpValues(root){
  (root||document).querySelectorAll(root?'.kpi .value':'#view .kpi .value').forEach(elm=>{
    const raw=elm.textContent.trim(); const m=raw.match(/^(\d[\d,]*)(.*)$/);
    if(!m) return; const target=Number(m[1].replace(/,/g,'')); const suffix=m[2]||'';
    if(!isFinite(target)||target<=0) return;
    const dur=650, t0=performance.now();
    function tick(t){const k=Math.min(1,(t-t0)/dur); const val=Math.round(target*(1-Math.pow(1-k,3)));
      elm.textContent=val.toLocaleString('en-IN')+suffix; if(k<1) requestAnimationFrame(tick);}
    elm.textContent='0'+suffix; requestAnimationFrame(tick);
  });
}

/* ===================== CHALLAN FUNNEL — ANALYTICS (per-panel filters) ===================== */
function fbData(){return (DOC&&DOC.funnel&&DOC.funnel.data)?DOC.funnel:FUNNEL_SNAPSHOT;}
const nfmt=n=>Number(n||0).toLocaleString('en-IN');
function crfmt(n){n=Number(n||0);return n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':n>=1e3?'₹'+(n/1e3).toFixed(1)+'K':'₹'+nfmt(n);}
const share=(a,b)=>b?Math.round(a/b*1000)/10:0;
const WIN_LABEL={'24h':'Last 24 hours','3d':'Last 3 days','7d':'Last 7 days','30d':'Last 30 days','all':'All-time'};
const WIN_DAYS={'24h':1,'3d':3,'7d':7,'30d':30,'all':9999};
const VLABEL={PUC_EXPIRED:'PUC expired',INSURANCE_EXPIRED:'Insurance expired',CHALLAN_PENDING:'Challan pending',REPEAT_OFFENDER:'Repeat offender',INTER_STATE_CHALLAN:'Inter-state challan',FITNESS_EXPIRED:'Fitness expired',OVERAGE_VEHICLE:'Overage vehicle',BLACKLIST:'Blacklisted',VEHICLE_TYPE_MISMATCH:'Type mismatch',RC_EXPIRED:'RC expired',NO_SEATBELT:'No seatbelt',NO_HELMET:'No helmet',PHONE_USE:'Phone use',TRIPLE_RIDING:'Triple riding',STOLEN:'Stolen',THEFT_HISTORY:'Theft history',FIR_RECORDED:'FIR recorded',PLATE_TAMPERING:'Plate tampering',VEHICLE_DEFECT:'Vehicle defect',ACCIDENT_PRONE:'Accident prone',MISMATCH:'Plate mismatch',COURT_CASE_PENDING:'Court case'};
const vlabel=k=>VLABEL[k]||String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const prettyClass=s=>String(s).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,c=>c.toUpperCase());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(s){const p=String(s).split('-');return (MON[+p[1]-1]||p[1])+' '+p[0];}

/* ---- shared filter state: changing Location/Window on any card syncs every card ---- */
const PANEL={};
function pstate(id){return PANEL[id]||(PANEL[id]={cam:'ALL',win:'30d'});}
function renderAllPanels(){FUNNEL_PANELS.forEach(id=>{if(document.getElementById('panel-'+id))renderPanel(id);});}
function psetCam(id,v){FUNNEL_PANELS.forEach(p=>pstate(p).cam=v);renderAllPanels();}
function psetWin(id,v){FUNNEL_PANELS.forEach(p=>pstate(p).win=v);renderAllPanels();}
window.psetCam=psetCam;window.psetWin=psetWin;

/* ---- parameterised aggregators (cam, win) ---- */
function aggFor(cam,win){
  const fd=fbData(), cams=fd.cameras||[];
  const sel=cam==='ALL'?cams.map(c=>c.id):[cam];
  const A={scans:0,alerts:0,intercepted:0,missed:0,challanPending:0,pucExpired:0,pendingAmount:0,pendingCount:0,paidCount:0,byType:{},byStatus:{},vClass:{},offences:{},stateM:{},offM:{},dmixM:{},hmM:{},sevM:{},smM:{},ins:{valid:0,expired:0,unknown:0},fit:{valid:0,expired:0,unknown:0},prev:{scans:0,alerts:0,intercepted:0},resp:[]};
  sel.forEach(id=>{
    const x=((fd.data||{})[id]||{})[win]; if(!x) return;
    A.scans+=x.scans||0; A.alerts+=x.alerts||0; A.intercepted+=x.intercepted||0; A.missed+=x.missed||0; A.pucExpired+=x.pucExpired||0; A.challanPending+=x.challanPending||0;
    A.paidCount+=x.paidCount||0;
    Object.entries(x.alertsByType||{}).forEach(([k,v])=>A.byType[k]=(A.byType[k]||0)+v);
    Object.entries(x.byStatus||{}).forEach(([k,v])=>A.byStatus[k]=(A.byStatus[k]||0)+v);
    (x.detectedMix||[]).forEach(b=>{const e=A.dmixM[b.bucket]||(A.dmixM[b.bucket]={bucket:b.bucket,detected:0,ingested:0});e.detected+=b.detected||0;e.ingested+=b.ingested||0;});
    (x.vehicleClass||[]).forEach(b=>A.vClass[b.label]=(A.vClass[b.label]||0)+b.count);
    (x.offences||[]).forEach(o=>A.offences[o.label]=(A.offences[o.label]||0)+o.count);
    (x.byState||[]).forEach(b=>A.stateM[b.label]=(A.stateM[b.label]||0)+b.count);
    (x.repeatOffenders||[]).forEach(o=>{const e=A.offM[o.plate]||(A.offM[o.plate]={plate:o.plate,sightings:0,lastSeen:''});e.sightings+=o.sightings||0;if((o.lastSeen||'')>e.lastSeen)e.lastSeen=o.lastSeen||'';});
    (x.docCompliance||[]).forEach(d=>{const t=d.type==='insurance'?A.ins:(d.type==='fitness'?A.fit:null);if(t){t.valid+=d.valid||0;t.expired+=d.expired||0;t.unknown+=d.unknown||0;}});
    (x.heatmap||[]).forEach(h=>{const k=h.dow+'-'+h.hour;A.hmM[k]=(A.hmM[k]||0)+(h.count||0);});
    (x.severity||[]).forEach(s=>{A.sevM[s.severity]=(A.sevM[s.severity]||0)+(s.count||0);});
    (x.severityMatrix||[]).forEach(s=>{const k=s.severity+'|'+s.alertType;A.smM[k]=(A.smM[k]||0)+(s.count||0);});
    if(x.avgResponseMin!=null) A.resp.push(x.avgResponseMin);
    const p=x.prev||{}; A.prev.scans+=p.scans||0; A.prev.alerts+=p.alerts||0; A.prev.intercepted+=p.intercepted||0;
  });
  A.byState=Object.keys(A.stateM).map(k=>({label:k,count:A.stateM[k]})).sort((a,b)=>b.count-a.count);
  A.repeatOffenders=Object.values(A.offM).sort((a,b)=>b.sightings-a.sightings).slice(0,10);
  A.detectedMix=Object.values(A.dmixM).map(b=>({bucket:b.bucket,detected:b.detected,ingested:b.ingested,readPct:b.detected?Math.round(b.ingested/b.detected*1000)/10:0})).sort((a,b)=>b.detected-a.detected);
  A.heatmap=Object.keys(A.hmM).map(k=>{const p=k.split('-');return {dow:+p[0],hour:+p[1],count:A.hmM[k]};});
  const SEV_ORDER=['CRITICAL','HIGH','MEDIUM','LOW'];
  A.severity=SEV_ORDER.filter(s=>A.sevM[s]!=null).map(s=>({severity:s,count:A.sevM[s]||0}));
  A.severityMatrix=Object.keys(A.smM).map(k=>{const p=k.split('|');return {severity:p[0],alertType:p[1],count:A.smM[k]};}).sort((a,b)=>b.count-a.count);
  // pending ₹/count: per-camera in current SATARK data (sum), but older data.json returns an identical system-wide value → don't double-count
  const pAmt=sel.map(id=>(((fd.data||{})[id]||{})[win]||{}).pendingAmount||0).filter(v=>v>0);
  const pCnt=sel.map(id=>(((fd.data||{})[id]||{})[win]||{}).pendingCount||0).filter(v=>v>0);
  const allEq=arr=>arr.length>1&&arr.every(v=>v===arr[0]);
  A.pendingAmount=allEq(pAmt)?pAmt[0]:pAmt.reduce((a,b)=>a+b,0);
  A.pendingCount=allEq(pCnt)?pCnt[0]:pCnt.reduce((a,b)=>a+b,0);
  A.actioned=A.intercepted+A.missed;
  A.rate=A.actioned?Math.round(A.intercepted/A.actioned*1000)/10:0;
  A.flagRate=share(A.alerts,A.scans);
  A.avgResponseMin=A.resp.length?Math.round(A.resp.reduce((a,b)=>a+b,0)/A.resp.length):null;
  return A;
}
function trendFor(cam,win){
  const fd=fbData(), sel=cam==='ALL'?(fd.cameras||[]).map(c=>c.id):[cam];
  const m={}; sel.forEach(id=>((fd.trends||{})[id]||[]).forEach(p=>m[p.date]=(m[p.date]||0)+p.count));
  let arr=Object.keys(m).sort().map(d=>({date:d,count:m[d]}));
  const days=WIN_DAYS[win]; if(days<9999) arr=arr.slice(-days);
  return arr;
}
function monthlyFor(cam){
  const fd=fbData(), sel=cam==='ALL'?(fd.cameras||[]).map(c=>c.id):[cam];
  const m={};
  sel.forEach(id=>((fd.monthly||{})[id]||[]).forEach(r=>{
    const o=m[r.month]||(m[r.month]={month:r.month,scans:0,violations:0,intercepted:0,missed:0,challansDetected:0});
    o.scans+=r.scans||0;o.violations+=r.violations||0;o.intercepted+=r.intercepted||0;o.missed+=r.missed||0;o.challansDetected+=r.challansDetected||0;
  }));
  return Object.keys(m).sort().map(k=>m[k]);
}

/* ---- per-panel filter bar ---- */
function panelFilters(id,o){
  o=o||{}; const st=pstate(id), fd=fbData();
  const camOpts=[['ALL','All']].concat((fd.cameras||[]).map(c=>[c.id,c.city]));
  const winOpts=[['24h','24h'],['3d','3d'],['7d','7d'],['30d','30d'],['all','All']];
  let h='<div class="pfilters">';
  if(o.cam!==false) h+='<div class="seg sm">'+camOpts.map(x=>`<button type="button" class="${x[0]===st.cam?'on':''}" onclick="psetCam('${id}','${x[0]}')">${esc(x[1])}</button>`).join('')+'</div>';
  if(o.win!==false) h+='<div class="seg sm">'+winOpts.map(x=>`<button type="button" class="${x[0]===st.win?'on':''}" onclick="psetWin('${id}','${x[0]}')">${esc(x[1])}</button>`).join('')+'</div>';
  return h+'</div>';
}
function fdelta(cur,prev){if(!prev||prev<10)return '';const d=Math.round((cur-prev)/prev*1000)/10;if(Math.abs(d)>500)return '';const up=d>=0;return ` <span class="fdelta ${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(d)}%</span>`;}
function kpiIf(cond,label,value,meta,accent){return cond?`<div class="card"><div class="label">${label}</div><div class="value${accent?' accent':''}">${value}</div><div class="meta">${meta}</div></div>`:'';}

/* ---- panel renderers ---- */
const PANEL_RENDER={};
PANEL_RENDER.overview=function(el,st){
  const a=aggFor(st.cam,st.win);
  el.innerHTML=panelFilters('overview',{})+`<div class="kpi">

    ${kpiIf(a.pendingAmount>0,'Pending challan dues',crfmt(a.pendingAmount),'unpaid · this selection')}
    ${kpiIf(a.pendingCount>0,'Pending challans',nfmt(a.pendingCount),nfmt(a.paidCount)+' paid')}
  </div>`;
};

      <div class="wstage" style="width:${w(a.intercepted)}%;background:linear-gradient(90deg,#15A66A,#63FFB1);color:#04331f"><b>${nfmt(a.intercepted)}</b><span>Intercepted by police</span></div>`:'<div class="wconv" style="color:var(--muted)">Interception not activated at this camera yet.</div>'}
    </div>
    ${reasons.length?`<div class="reasons">${reasons.map(([k,v])=>`<div class="rchip"><div class="rv">${nfmt(v)}</div><div class="rl">${esc(vlabel(k))}</div><div class="rp">${share(v,a.alerts)}% of violations</div></div>`).join('')}</div>`:''}
  </div>`;

PANEL_RENDER.outcome=function(el,st){

  el.innerHTML=`<div class="card chartcard">${panelFilters('class',{})}<h3>Vehicle class mix</h3><p>Kinds of vehicles scanned.</p>${vc.length?'<div class="canvas-wrap tall"><canvas id="cv-class"></canvas></div>':'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No vehicle data.</div>'}</div>`;

  charts.class=new Chart(cv,{type:'bar',data:{labels:vc.map(e=>prettyClass(e[0])),datasets:[{data:vc.map(e=>e[1]),backgroundColor:vc.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:20}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${nfmt(c.parsed.x)} vehicles`}}},scales:{x:{grid:{color:'#ECECF4'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}},y:{grid:{display:false}}}}});
};
PANEL_RENDER.compliance=function(el,st){
  const a=aggFor(st.cam,st.win), insT=a.ins.valid+a.ins.expired;
  el.innerHTML=`<div class="card chartcard">${panelFilters('compliance',{})}<h3>Document compliance</h3><p>${insT?'Insurance valid vs expired, with PUC &amp; fitness expiries.':'No document data.'}</p>${insT?`<div class="canvas-wrap"><canvas id="cv-compl"></canvas></div>
    <div class="complrow"><div class="compl"><div class="cv" style="color:#F59E0B">${nfmt(a.pucExpired)}</div><div class="cl">PUC expired</div></div><div class="compl"><div class="cv" style="color:#FF4F01">${nfmt(a.ins.expired)}</div><div class="cl">Insurance expired</div></div><div class="compl"><div class="cv" style="color:#E5484D">${a.fit.expired?nfmt(a.fit.expired):'—'}</div><div class="cl">Fitness expired</div></div></div>`:'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No document data in this window.</div>'}</div>`;
  const cv=document.getElementById('cv-compl'); if(!cv||!insT||typeof Chart==='undefined')return;
  charts.compliance=new Chart(cv,{type:'doughnut',data:{labels:['Valid','Expired'],datasets:[{data:[a.ins.valid,a.ins.expired],backgroundColor:['#15A66A','#FF4F01'],borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,boxWidth:8,font:{size:11.5}}},tooltip:{callbacks:{label:c=>` ${c.label}: ${nfmt(c.parsed)} (${share(c.parsed,insT)}%)`}}}}});
};
const VT_LABEL={'4W':'4-wheeler','2W':'2-wheeler','3W':'3-wheeler','HEAVY':'Heavy vehicle','UNKNOWN':'Unknown'};
PANEL_RENDER.detmix=function(el,st){
  const a=aggFor(st.cam,st.win), dm=(a.detectedMix||[]).filter(b=>b.detected>0);
  el.innerHTML=`<div class="card chartcard">${panelFilters('detmix',{})}<h3>Detection by vehicle type</h3><p>Vehicles detected vs number-plates actually read (ANPR read-rate), by type. Four-wheelers read best.</p>${dm.length?'<div class="canvas-wrap"><canvas id="cv-detmix"></canvas></div>':'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No detection-mix data in this window.</div>'}</div>`;
  const cv=document.getElementById('cv-detmix'); if(!cv||!dm.length||typeof Chart==='undefined')return;
  charts.detmix=new Chart(cv,{type:'bar',data:{labels:dm.map(b=>VT_LABEL[b.bucket]||b.bucket),datasets:[
    {label:'Detected',data:dm.map(b=>b.detected),backgroundColor:'#A4C2F4',borderRadius:5,borderSkipped:false,maxBarThickness:30},
    {label:'Plates read',data:dm.map(b=>b.ingested),backgroundColor:'#4736FE',borderRadius:5,borderSkipped:false,maxBarThickness:30}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,boxWidth:8,font:{size:11.5}}},tooltip:{callbacks:{afterBody:c=>' Read rate: '+dm[c[0].dataIndex].readPct+'%'}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#ECECF4'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}}}});
};
PANEL_RENDER.offence=function(el,st){
  const a=aggFor(st.cam,st.win), offs=Object.entries(a.offences||{}).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]).slice(0,7);
  el.innerHTML=`<div class="card chartcard">${panelFilters('offence',{})}<h3>Top offence types</h3><p>Specific offences behind the pending challans.</p>${offs.length?'<div class="canvas-wrap tall"><canvas id="cv-off"></canvas></div>':'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No offence-level data in this window.</div>'}</div>`;
  const cv=document.getElementById('cv-off'); if(!cv||!offs.length||typeof Chart==='undefined')return;
  charts.offence=new Chart(cv,{type:'bar',data:{labels:offs.map(e=>e[0].length>44?e[0].slice(0,42)+'…':e[0]),datasets:[{data:offs.map(e=>e[1]),backgroundColor:offs.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:22}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>offs[c[0].dataIndex][0],label:c=>` ${nfmt(c.parsed.x)} challans`}}},scales:{x:{grid:{color:'#ECECF4'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}},y:{grid:{display:false}}}}});
};
PANEL_RENDER.month=function(el,st){
  const mm=monthlyFor(st.cam);
  el.innerHTML=`<div class="card chartcard">${panelFilters('month',{win:false})}<h3>Month-on-month</h3><p>Scans vs violations by calendar month — grows each month.</p>${mm.length?`<div class="canvas-wrap"><canvas id="cv-month"></canvas></div>
    <div class="tscroll" style="margin-top:14px"><table class="cmp"><thead><tr><th>Month</th><th>Vehicles scanned</th><th>Violations detected</th><th>Flag rate</th></tr></thead><tbody>${mm.map(r=>`<tr><td class="mlabel">${monthLabel(r.month)}</td><td class="nowrap">${nfmt(r.scans)}</td><td class="nowrap">${nfmt(r.violations)}</td><td class="nowrap mcomb">${share(r.violations,r.scans)}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No monthly data yet.</div>'}</div>`;
  const cv=document.getElementById('cv-month'); if(!cv||!mm.length||typeof Chart==='undefined')return;
  charts.month=new Chart(cv,{type:'bar',data:{labels:mm.map(r=>monthLabel(r.month)),datasets:[{label:'Vehicles scanned',data:mm.map(r=>r.scans),backgroundColor:'#4736FE',borderRadius:5,borderSkipped:false,maxBarThickness:46},{label:'Violations detected',data:mm.map(r=>r.violations),backgroundColor:'#63C6A8',borderRadius:5,borderSkipped:false,maxBarThickness:46}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,boxWidth:8,font:{size:11.5}}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${nfmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#ECECF4'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}}}});
};
PANEL_RENDER.compare=function(el,st){
  const cmpTitle=(fbData().cameras||[]).map(c=>c.city).join(' vs ')||'Camera comparison';
  el.innerHTML=`<div class="card chartcard" style="padding-bottom:10px">${panelFilters('compare',{cam:false})}<h3>${esc(cmpTitle)}</h3><p>Full funnel side by side · <b>Combined</b> = network total.</p><div class="tscroll">${comparisonTableFor(st.win)}</div></div>
    <div class="fnote">All metrics — including <b>pending challan dues &amp; count</b> — are now per-camera (SATARK update). “Intercepted / Missed / Expired” come from what officers logged in the Vehicle Alert app. Every card on this tab filters independently.</div>`;
};
function comparisonTableFor(win){
  const fd=fbData(), cams=fd.cameras||[];
  const cw=cams.map(c=>{const w=((fd.data||{})[c.id]||{})[win]||{}, at=w.alertsByType||{};
    return {name:c.city,scans:w.scans||0,alerts:w.alerts||0,challans:at.CHALLAN_PENDING||0,puc:w.pucExpired||0,ins:at.INSURANCE_EXPIRED||0,intercepted:w.intercepted||0,missed:w.missed||0,pendAmt:w.pendingAmount||0,pendCnt:w.pendingCount||0};});
  const comb={}; ['scans','alerts','challans','puc','ins','intercepted','missed','pendAmt','pendCnt'].forEach(k=>comb[k]=cw.reduce((a,r)=>a+r[k],0));
  const irate=o=>{const act=o.intercepted+o.missed;return act?Math.round(o.intercepted/act*1000)/10:0;};
  const spec=[['Vehicles scanned',o=>nfmt(o.scans)],['Violations detected',o=>nfmt(o.alerts)],['Flag rate',o=>share(o.alerts,o.scans)+'%'],
    ['PUC expired',o=>nfmt(o.puc)],['Insurance expired',o=>nfmt(o.ins)],
    ['Intercepted',o=>nfmt(o.intercepted)],['Missed',o=>nfmt(o.missed)],['Interception rate',o=>irate(o)+'%'],
    ['Pending challans',o=>nfmt(o.pendCnt)],['Pending challan dues',o=>crfmt(o.pendAmt)]];
  const head='<tr><th>Metric</th>'+cw.map(c=>`<th>${esc(c.name)}</th>`).join('')+'<th>Combined</th></tr>';
  const body=spec.map(function(row){return '<tr><td class="mlabel">'+row[0]+'</td>'+cw.map(c=>`<td class="nowrap">${row[1](c)}</td>`).join('')+`<td class="nowrap mcomb">${row[1](comb)}</td></tr>`;}).join('');
  return `<table class="cmp"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function maskPlate(p){p=String(p||'');return p.length>4?p.slice(0,-4)+'••••':p;}
const STATE_NM={RJ:'Rajasthan',HR:'Haryana',DL:'Delhi',UP:'Uttar Pradesh',HP:'Himachal',TN:'Tamil Nadu',KL:'Kerala',UK:'Uttarakhand',MH:'Maharashtra',GJ:'Gujarat',PB:'Punjab',KA:'Karnataka',MP:'Madhya Pradesh',WB:'West Bengal',BR:'Bihar',CH:'Chandigarh',JK:'J&K',AS:'Assam',OD:'Odisha',TS:'Telangana',AP:'Andhra',CG:'Chhattisgarh',JH:'Jharkhand'};
const stateName=c=>c+(STATE_NM[c]?' · '+STATE_NM[c]:'');
PANEL_RENDER.states=function(el,st){
  const a=aggFor(st.cam,st.win), bs=(a.byState||[]).slice(0,10);
  el.innerHTML=`<div class="card chartcard">${panelFilters('states',{})}<h3>Challans by registration state</h3><p>Where the flagged vehicles are registered — out-of-state offenders stand out.</p>${bs.length?'<div class="canvas-wrap tall"><canvas id="cv-states"></canvas></div>':'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No state data in this window.</div>'}</div>`;
  const cv=document.getElementById('cv-states'); if(!cv||!bs.length||typeof Chart==='undefined')return;
  charts.states=new Chart(cv,{type:'bar',data:{labels:bs.map(e=>e.label),datasets:[{data:bs.map(e=>e.count),backgroundColor:bs.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:22}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>stateName(bs[c[0].dataIndex].label),label:c=>` ${nfmt(c.parsed.x)} vehicles`}}},scales:{x:{grid:{color:'#ECECF4'},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}},y:{grid:{display:false}}}}});
};
PANEL_RENDER.offenders=function(el,st){
  const a=aggFor(st.cam,st.win), ro=(a.repeatOffenders||[]).slice(0,10);
  el.innerHTML=`<div class="card chartcard">${panelFilters('offenders',{})}<h3>Repeat / habitual offenders</h3><p>Vehicles seen most often at the signal — likely habitual violators. Plates part-masked for privacy.</p>${ro.length?`<div class="tscroll"><table class="cmp"><thead><tr><th>#</th><th>Vehicle</th><th>Sightings</th><th>Last seen</th></tr></thead><tbody>${ro.map((o,i)=>`<tr><td class="mlabel">${i+1}</td><td class="nowrap">${esc(maskPlate(o.plate))}</td><td class="nowrap mcomb">${nfmt(o.sightings)}</td><td class="nowrap">${esc(o.lastSeen||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No repeat-offender data in this window.</div>'}</div>`;
};

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
PANEL_RENDER.heatmap=function(el,st){
  const a=aggFor(st.cam,st.win), hm=a.heatmap||[];
  const max=hm.reduce((m,h)=>Math.max(m,h.count),0), grid={};
  hm.forEach(h=>grid[h.dow+'-'+h.hour]=h.count);
  let hdr='<div class="hmrow"><div class="hmday"></div>';
  for(let h=0;h<24;h++) hdr+=`<div class="hmhr">${h}</div>`;
  hdr+='</div>';
  let body='';
  for(let d=0;d<7;d++){ body+=`<div class="hmrow"><div class="hmday">${DOW[d]}</div>`;
    for(let h=0;h<24;h++){const v=grid[d+'-'+h]||0,t=max?v/max:0,bg=v?`rgba(71,54,254,${(0.10+t*0.9).toFixed(2)})`:'#EEEEF6';
      body+=`<div class="hmcell" style="background:${bg}" title="${DOW[d]} ${h}:00 — ${nfmt(v)} alerts"></div>`;}
    body+='</div>'; }
  el.innerHTML=`<div class="card chartcard">${panelFilters('heatmap',{})}<h3>Busiest times — day × hour</h3><p>When vehicles are flagged, by weekday and hour of day. Darker = more alerts.</p>${hm.length?`<div class="tscroll"><div class="heatmap">${hdr}${body}</div></div>`:'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No time-of-day data in this window.</div>'}</div>`;
};
const SEV_COLOR={CRITICAL:'#E5484D',HIGH:'#FF4F01',MEDIUM:'#F59E0B',LOW:'#63C6A8'};
const sevCap=s=>s?s[0]+s.slice(1).toLowerCase():s;
PANEL_RENDER.severity=function(el,st){
  const a=aggFor(st.cam,st.win), sv=(a.severity||[]).filter(s=>s.count>0), tot=sv.reduce((s,x)=>s+x.count,0);
  el.innerHTML=`<div class="card chartcard">${panelFilters('severity',{})}<h3>Severity distribution</h3><p>How serious the flagged violations are.</p>${sv.length?'<div class="canvas-wrap"><canvas id="cv-sev"></canvas></div>':'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No severity data.</div>'}</div>`;
  const cv=document.getElementById('cv-sev'); if(!cv||!sv.length||typeof Chart==='undefined')return;
  charts.sev=new Chart(cv,{type:'doughnut',data:{labels:sv.map(s=>sevCap(s.severity)),datasets:[{data:sv.map(s=>s.count),backgroundColor:sv.map(s=>SEV_COLOR[s.severity]||'#999'),borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,boxWidth:8,font:{size:11.5}}},tooltip:{callbacks:{label:c=>` ${c.label}: ${nfmt(c.parsed)} (${share(c.parsed,tot)}%)`}}}}});
};
PANEL_RENDER.sevtable=function(el,st){
  const a=aggFor(st.cam,st.win), sm=(a.severityMatrix||[]).slice(0,12);
  el.innerHTML=`<div class="card chartcard">${panelFilters('sevtable',{})}<h3>Severity by violation type</h3><p>Which violation types drive each severity level.</p>${sm.length?`<div class="tscroll"><table class="cmp"><thead><tr><th>Severity</th><th>Violation type</th><th>Count</th></tr></thead><tbody>${sm.map(r=>`<tr><td class="mlabel"><span class="sevdot" style="background:${SEV_COLOR[r.severity]||'#999'}"></span>${sevCap(r.severity)}</td><td class="nowrap">${esc(vlabel(r.alertType))}</td><td class="nowrap mcomb">${nfmt(r.count)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="in" style="color:var(--muted);font-size:13px;padding:12px 0">No severity-type data.</div>'}</div>`;
};

/* ---- panel dispatch: re-render just one panel + rebuild only its chart ---- */
function renderPanel(id){
  const el=document.getElementById('panel-'+id); if(!el) return;
  if(charts[id]){ try{charts[id].destroy();}catch(e){} delete charts[id]; }
  const fn=PANEL_RENDER[id]; if(fn){ fn(el,pstate(id)); countUpValues(el); }
}
const FUNNEL_PANELS=['overview','journey','outcome','trend','detmix','compliance','offence','severity','sevtable','heatmap','month','compare'];

/* live hero-banner stats for the funnel tab — recomputed from the feed on every refresh */
function funnelBandStats(){
  const fd=fbData(); if(!fd||!fd.data) return [];
  const a=aggFor('ALL','all');
  return [
    [nfmt(a.scans),'vehicles scanned · all-time'],
    [nfmt(a.alerts),'violations surfaced'],
    [crfmt(a.pendingAmount),'challan dues pending'],
    [String((fd.cameras||[]).length),'ANPR cameras live']
  ];
}
function renderFunnel(){
  const fd=fbData();
  destroyCharts();
  const asOf=fd.generatedAt?new Date(fd.generatedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
  document.getElementById('view').innerHTML=`
    <section style="padding-bottom:10px">
      <div class="fctrls"><span class="fasof"><span class="statusdot"></span>Live · SATARK · as of ${esc(asOf)}</span></div>
      <p class="subc" style="margin-top:10px">Every chart and table below filters on its own — set a different <b>Location</b> or <b>Window</b> on each card to compare slices side by side.</p>
    </section>
    <section style="padding-top:6px"><div class="sectitle">Overview</div><div id="panel-overview" class="panel"></div></section>
    <section><div class="sectitle">The journey — camera to challan</div><div id="panel-journey" class="panel"></div></section>
    <section><div class="charts"><div class="row2"><div id="panel-outcome" class="panel"></div><div id="panel-trend" class="panel"></div></div></div></section>
    <section><div class="sectitle">Vehicle &amp; document analysis</div><div class="charts"><div class="row2"><div id="panel-detmix" class="panel"></div><div id="panel-compliance" class="panel"></div></div></div></section>
    <section><div class="sectitle">Offences</div><div id="panel-offence" class="panel"></div></section>
    <section><div class="sectitle">Severity</div><div class="charts"><div class="row2"><div id="panel-severity" class="panel"></div><div id="panel-sevtable" class="panel"></div></div></div></section>
    <section><div class="sectitle">Busiest times</div><div id="panel-heatmap" class="panel"></div></section>
    <section><div class="sectitle">Month-on-month</div><div id="panel-month" class="panel"></div></section>
    <section><div class="sectitle">Camera comparison</div><div id="panel-compare" class="panel"></div></section>`;
  FUNNEL_PANELS.forEach(renderPanel);
}
/* ===================== CHARTS ===================== */
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function buildCharts(rows,prog){
  destroyCharts();
  if(typeof Chart==='undefined'||!rows.length)return;
  Chart.defaults.font.family="'Geist',sans-serif";Chart.defaults.color='#6B6B86';
  const sorted=rows.slice().sort((a,b)=>toPct(b.progress)-toPct(a.progress));
  charts.progress=new Chart(document.getElementById('cProgress'),{type:'bar',
    data:{labels:sorted.map(r=>r.city),datasets:[{label:'Progress %',data:sorted.map(r=>toPct(r.progress)),backgroundColor:sorted.map(r=>phaseColor(r.phase)),borderRadius:5,borderSkipped:false,maxBarThickness:20}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x}% · ${sorted[c.dataIndex].phase}`}}},scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},y:{grid:{display:false}}}}});
  const present=PHASE_ORDER.filter(ph=>rows.some(r=>r.phase===ph));
  rows.forEach(r=>{if(!present.includes(r.phase))present.push(r.phase);});
  const DONUT_LABELS={id:'donutLabels',afterDatasetsDraw(ch){const g=ch.ctx,m=ch.getDatasetMeta(0);g.save();g.font='800 13px Geist';g.textAlign='center';g.textBaseline='middle';m.data.forEach((arc,i)=>{const v=ch.data.datasets[0].data[i];if(!v)return;const p=arc.getCenterPoint();g.fillStyle='rgba(0,0,0,.18)';g.fillText(v,p.x+0.6,p.y+0.6);g.fillStyle='#fff';g.fillText(v,p.x,p.y);});g.restore();}};
  charts.dist=new Chart(document.getElementById('cDist'),{type:'doughnut',
    data:{labels:present,datasets:[{data:present.map(ph=>rows.filter(r=>r.phase===ph).length),backgroundColor:present.map(phaseColor),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',padding:11,boxWidth:8,font:{size:11}}}}},
    plugins:[DONUT_LABELS]});
  const gc=gateCompletion(rows,prog);
  charts.gate=new Chart(document.getElementById('cGate'),{type:'bar',
    data:{labels:gc.map(g=>g.label),datasets:[{label:'% items done',data:gc.map(g=>g.pct),backgroundColor:gc.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:60}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>gc[c[0].dataIndex].gate,label:c=>` ${c.parsed.y}% of checklist done`}}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},x:{grid:{display:false}}}}});
}

/* ===================== EVENTS / INIT ===================== */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b||b.dataset.tab===activeKey)return;activeKey=b.dataset.tab;render(true);});
document.getElementById('refreshBtn').addEventListener('click',async()=>{const b=document.getElementById('refreshBtn');b.style.opacity='.5';b.style.pointerEvents='none';await loadData();render(true);b.style.opacity='';b.style.pointerEvents='';});
document.getElementById('refMin').textContent=Math.round(CONFIG.REFRESH_SECONDS/60);
(async function init(){await loadData();render(true);if(timer)clearInterval(timer);timer=setInterval(async()=>{await loadData();render(false);},CONFIG.REFRESH_SECONDS*1000);})();
</script>
