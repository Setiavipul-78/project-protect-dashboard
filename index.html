<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --blue:#4736FE; --blued:#2B2098; --mint:#63FFB1; --orange:#FF4F01;
    --bluel:#E3E1FF; --ink:#020618; --muted:#6B6B86; --line:#ECECF4;
    --bg:#F6F6FC; --card:#fff; --amber:#F59E0B;
    --radius:18px; --shadow:0 1px 3px rgba(20,20,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

  /* NAV */
  nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 26px;
    background:rgba(255,255,255,.8);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .logo{width:34px;height:34px;border-radius:9px;object-fit:cover;box-shadow:0 2px 8px rgba(71,54,254,.28);transition:transform .18s ease}
  .brand:hover .logo{transform:rotate(-6deg) scale(1.05)}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
  .wordmark .pp{color:var(--muted);font-weight:600}
  .tabs{flex:1 1 auto;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(71,54,254,.28)}
  .navright{flex:0 0 auto;display:flex;align-items:center;gap:12px}
  .refresh{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:.18s}
  .refresh:hover{border-color:var(--blue);color:var(--blue)}
  .refresh svg{width:14px;height:14px}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .dot.live{background:#15A66A;box-shadow:0 0 0 4px rgba(21,166,106,.15);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,166,106,.35)}70%{box-shadow:0 0 0 7px rgba(21,166,106,0)}100%{box-shadow:0 0 0 0 rgba(21,166,106,0)}}
  .synced{font-size:11px;color:var(--muted);font-weight:500}

  /* HERO */
  .hero{color:#fff;padding:40px 0 44px;position:relative;overflow:hidden;
    background:radial-gradient(1100px 460px at 82% -10%, rgba(99,255,177,.20), transparent),
      radial-gradient(circle at 16% 20%, rgba(99,255,177,.30), transparent 42%),
      linear-gradient(115deg,#4736FE,#2B2098)}
  .hero .wrap{position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:30px;font-size:12px;font-weight:600;margin-bottom:15px}
  .hero h1{font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-1.2px;line-height:1.06;max-width:840px}
  .hero h1 em{font-style:normal;color:var(--mint)}
  .hero .lead{font-size:16px;opacity:.9;max-width:700px;margin-top:14px}
  .bandstats{display:flex;flex-wrap:wrap;gap:26px;margin-top:24px}
  .bandstats .s .n{font-size:26px;font-weight:800;letter-spacing:-1px}
  .bandstats .s .l{font-size:11.5px;opacity:.85;max-width:170px;margin-top:2px}

  /* LAYOUT */
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  section{padding:34px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sectitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:18px}
  .sec2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .subc{color:var(--muted);font-size:14.5px;margin-bottom:4px;max-width:900px}
  .subc b{color:var(--blued)}

  /* KPI */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi .card{padding:20px 22px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .kpi .value{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
  .kpi .value.accent{color:var(--blue)}
  .kpi .meta{font-size:12px;color:var(--muted);margin-top:4px}

  /* charts */
  .charts{display:grid;gap:20px}
  .row2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
  .chartcard{padding:22px}
  .chartcard h3{font-size:15px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
  .chartcard p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .canvas-wrap{position:relative;height:300px}
  .canvas-wrap.tall{height:460px}

  /* insights / city cards */
  .insights{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .insight{padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
  .idot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .insight .it{font-weight:700;font-size:14.5px;margin-bottom:2px;letter-spacing:-.01em}
  .insight .in{font-size:13px;color:var(--muted)}

  /* table */
  .tablecard{padding:8px 4px 4px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:1020px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:14px 16px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAFAFE}
  td.city{font-weight:700;white-space:nowrap}
  .pbar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4736FE,#63FFB1)}
  .pval{font-size:12.5px;font-weight:700;color:var(--muted)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .daybadge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
  .daybadge.warn{background:rgba(245,158,11,.16);color:#B45309}
  .poc{font-size:12.5px;white-space:nowrap}
  .nowrap{white-space:nowrap}
  .remark{font-size:12.5px;color:var(--muted);min-width:240px;max-width:340px}

  /* journeys */
  .journeycard{padding:22px 24px;margin-bottom:16px}
  .journeycard h3{font-size:16px;font-weight:800;margin-bottom:10px}
  .journey{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .jstep{border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-width:118px}
  .jstep .t{font-weight:700;font-size:13.5px}
  .jstep .d{font-size:12px;color:var(--muted);margin-top:2px}
  .jgap{font-size:12px;font-weight:800;color:var(--orange);white-space:nowrap}
  .jnote{font-size:12.5px;color:var(--muted);margin-top:12px}

  /* story editorial */
  .storywrap section{padding:34px 0;border-top:1px solid var(--line)}
  .storywrap section:first-child{border-top:none;padding-top:10px}
  .prose p{margin-bottom:13px;font-size:15px}
  .prose b{color:var(--blued);font-weight:700}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
  .callout{background:linear-gradient(120deg,#fff,#F3F1FF);border:1px solid var(--bluel)}
  .cap{font-size:12px;color:var(--muted);margin-top:6px}
  .numgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .numgrid .v{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .step .ic{width:42px;height:42px;border-radius:11px;background:var(--bluel);display:flex;align-items:center;justify-content:center;margin-bottom:11px;font-size:23px}
  .step .num{font-size:11px;font-weight:800;color:var(--blue)}
  .step h4{font-size:14px;margin:2px 0 5px;font-weight:700}
  .step p{font-size:12.5px;color:var(--muted)}
  .jtl{position:relative;margin-top:8px;padding-left:26px}
  .jtl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--bluel)}
  .jtl .it{position:relative;margin-bottom:18px}
  .jtl .it:last-child{margin-bottom:0}
  .jtl .it:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--bluel)}
  .jtl .d{font-size:12px;font-weight:700;color:var(--blue)}
  .jtl .t{font-size:14px;font-weight:700}
  .jtl .x{font-size:13px;color:var(--muted)}
  .press{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.18s}
  .pcard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(71,54,254,.12)}
  .pcard .src{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:6px}
  .pcard .h{font-size:13.5px;font-weight:600;line-height:1.4}
  .pcard .go{font-size:12px;color:var(--muted);margin-top:9px;font-weight:600}
  .tlmeta{font-size:11px;color:var(--muted);margin-top:6px}

  /* initiatives */
  .initgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .initcard{padding:18px 20px}
  .inithead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .inittitle{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .initnote{font-size:13px;color:var(--muted);margin:6px 0 12px}
  .initmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bluel);color:var(--blued)}

  /* gallery + context */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .gcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);transition:transform .16s ease, box-shadow .16s ease}
  .gcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,20,60,.10)}
  .gcard img{width:100%;height:172px;object-fit:cover;display:block;background:linear-gradient(135deg,#EEF0FF,#E3E1FF)}
  .gcard .cap{font-size:12px;color:var(--muted);padding:9px 13px;line-height:1.4}
  .ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:6px}
  .ctx .b{padding:16px 18px}
  .ctx .b .n{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:-.5px}
  .ctx .b .t{font-size:12.5px;color:var(--muted);margin-top:3px}
  .storystrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px}
  @media(max-width:700px){.storystrip{grid-template-columns:1fr}}

  footer{padding:30px 0 50px;text-align:center;color:var(--muted);font-size:12px}

  /* ---------- interactivity & motion ---------- */
  .card{transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease}
  .kpi .card:hover,.insight:hover,.initcard:hover,.chartcard:hover,.journeycard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,20,60,.09);border-color:var(--bluel)}
  .insight,.initcard,.kpi .card{cursor:default}
  .tab{position:relative}
  .tab:active{transform:scale(.96)}
  .refresh:active{transform:scale(.96)}
  .refresh svg{transition:transform .5s ease}
  .refresh:hover svg{transform:rotate(180deg)}
  .pbar i{animation:grow .8s cubic-bezier(.4,0,.2,1) both}
  @keyframes grow{from{width:0}}
  #view.anim section{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
  #view.anim section:nth-child(2){animation-delay:.06s}
  #view.anim section:nth-child(3){animation-delay:.12s}
  #view.anim section:nth-child(4){animation-delay:.18s}
  #view.anim section:nth-child(5){animation-delay:.24s}
  #view.anim section:nth-child(n+6){animation-delay:.3s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  @media(max-width:980px){
    .wrap,.hero .wrap{padding-left:18px;padding-right:18px}
  }
  @media(max-width:900px){
    .row2{grid-template-columns:1fr}
    .insights,.grid2,.initgrid{grid-template-columns:1fr}
    .steps{grid-template-columns:repeat(2,1fr)}
    nav{flex-wrap:wrap}
    .hero h1{font-size:clamp(23px,6vw,30px)}
    .canvas-wrap.tall{height:380px}
  }
  @media(max-width:640px){
    nav{gap:10px;padding:10px 14px}
    .wordmark{font-size:15px}
    .tabs{order:3;flex-basis:100%;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;margin-top:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto}
    .navright{margin-left:auto}
    .synced{display:none}
    section{padding:24px 0}
    .sec2{font-size:20px}
    .kpi{grid-template-columns:1fr 1fr;gap:12px}
    .kpi .card{padding:16px 16px}
    .kpi .value{font-size:23px}
    .ctx,.steps,.gallery{grid-template-columns:1fr 1fr}
    .bandstats{gap:16px}
    .bandstats .s .n{font-size:21px}
    .hero{padding:28px 0 32px}
    .canvas-wrap,.canvas-wrap.tall{height:320px}
  }
  @media(max-width:430px){
    .kpi,.ctx,.steps,.gallery,.storystrip{grid-template-columns:1fr}
    .journey{gap:7px}
    .jstep{min-width:0;flex:1 1 100%}
  }

  /* ---------- CHALLAN FUNNEL — ANALYTICS ---------- */
  .fctrls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin:-6px 0 2px}
  .fctrl{display:flex;align-items:center;gap:9px;min-width:0}
  .seglabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;flex:0 0 auto}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{border:none;background:transparent;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;flex:0 0 auto}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(71,54,254,.26)}
  .fasof{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#15A66A;margin-right:5px}
  .fdelta{font-size:12px;font-weight:700;vertical-align:middle}
  .fdelta.up{color:#15A66A}.fdelta.down{color:#FF4F01}

  /* waterfall funnel — centered tapering stages */
  .funnelcard{padding:24px 26px}
  .wfunnel{display:flex;flex-direction:column;align-items:center;gap:4px}
  .wstage{min-width:120px;max-width:100%;height:58px;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,20,60,.12);animation:fgrow .8s cubic-bezier(.4,0,.2,1) both}
  @keyframes fgrow{from{transform:scaleX(.2);opacity:0}}
  .wstage b{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1}
  .wstage span{font-size:11.5px;font-weight:600;opacity:.92;margin-top:3px}
  .wconv{font-size:12px;color:var(--muted);font-weight:600}
  .wconv .arw{color:var(--orange);font-weight:900;margin-right:4px}
  .reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
  .rchip{text-align:center}
  .rchip .rv{font-size:20px;font-weight:800;color:var(--blued);letter-spacing:-.3px}
  .rchip .rl{font-size:12px;font-weight:600;margin-top:2px}
  .rchip .rp{font-size:11px;color:var(--muted);margin-top:1px}

  /* compliance */
  .complrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .compl{text-align:center}
  .compl .cv{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .compl .cl{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}

  .panel{min-width:0}
  .pfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .seg.sm{padding:2px}
  .seg.sm button{padding:5px 10px;font-size:11.5px}
  .chartcard .pfilters{margin-bottom:12px}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.cmp{min-width:520px}
  table.cmp th:first-child,table.cmp td.mlabel{text-align:left;font-weight:700}
  table.cmp th:not(:first-child),table.cmp td:not(.mlabel){text-align:right}
  table.cmp td.mcomb{font-weight:800;color:var(--blued);background:#F3F1FF}
  table.cmp th:last-child{color:var(--blued)}
  .fnote{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-top:16px;line-height:1.5}
  .fnote b{color:var(--blued)}
  /* mobile-overflow guards: let grid/flex children shrink below content */
  .charts,.row2,.chartcard,.kpi .card,.tablecard{min-width:0}
  .row2>*{min-width:0}
  @media(max-width:640px){
    .funnelcard{padding:20px 16px}
    .fasof{margin-left:0;flex-basis:100%}
    .reasons{grid-template-columns:1fr 1fr}
    .complrow{grid-template-columns:1fr 1fr 1fr}
    .wstage b{font-size:18px}
  }
</style>
</head>

const LEGACY_SIGNAGE_GATES=[{gate:'Gate 1 · TP Permission',steps:['Meeting Done','MoU Sent','MoU Signed']},{gate:'Gate 2 · Municipal Permission',steps:['Meeting Done','Application Sent','Signed']},{gate:'Gate 3 · Designing',steps:['Design Drafted','Design Approved by Dept','Vendor Recce Done','Recce Images Received','Sampling Done']},{gate:'Gate 4 · Procurement',steps:['PR Raised','PO Released','Advance Released']},{gate:'Gate 5 · Installation',steps:['Production Done','Boards Installed','Live']}];

/* ===================== HELPERS ===================== */
function toPct(v){let n=Number(String(v).replace('%','').trim());if(isNaN(n))return 0;if(n<=1.0001)n=n*100;return Math.round(n);}
const isDone=v=>String(v).trim().toLowerCase()==='done';
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
function daysInStage(s){const d=parseDate(s);if(!d)return null;const t=new Date();return Math.max(0,Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/86400000));}
function fmtDate(s){const d=parseDate(s);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):(s||'—');}
function statusOf(r){const p=toPct(r.progress);if(p>=100||/^live/i.test(r.phase||''))return 'Live';if(/backlog/i.test(r.phase||''))return 'Backlog';const d=daysInStage(r.lastUpdate);if(d!==null&&d>21)return 'Delayed';if(/outreach/i.test(r.phase||''))return 'Outreach';return 'In Progress';}
const programByKey=k=>DOC.programs.find(p=>p.key===k);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phaseColor=ph=>PHASE_COLOR[ph]|| '#A4C2F4';

/* ===================== DATA LOAD ===================== */
function normalizeDoc(j){
  if(j&&Array.isArray(j.programs)&&j.programs.length&&Array.isArray(j.programs[0].rows))
    return {programs:j.programs,updates:j.updates||[],initiatives:j.initiatives||[],generatedAt:j.generatedAt,funnel:j.funnel};
  if(j&&Array.isArray(j.headers)&&Array.isArray(j.rows)) return legacyToDoc(j);
  return null;
}
function legacyToDoc(j){
  const rows=j.rows, isSig=r=>/road safety/i.test(r['Tracker Sheet']||'')||r['Testing live']==='Road Safety Signages';
  function mk(rf,gates,key,label){return {key,label,gates,rows:rf.map(r=>{const sig=key==='Road Safety Signages';const steps={};gates.forEach(g=>{steps[g.gate]={};g.steps.forEach(s=>{steps[g.gate][s]=sig?'':(r[s]||'');});});return {city:r['City']||'—',phase:r['Current Phase']||'—',progress:r['Progress'],permPOC:r['Permission POC']||'',vendorPOC:r['Vendor POC']||'',lastUpdate:sig?(r['ANPR camera installed']||''):(r['Last update']||''),remark:sig?(r['Electricity & WiFi done']||''):(r['Remarks']||''),expected:sig?'':(r['Expected Go Live Date']||''),steps};})};}
  const bb=rows.filter(r=>!isSig(r)&&(r['Tracker Sheet']||'Challan Billboard')==='Challan Billboard'), sg=rows.filter(isSig);
  const programs=[mk(bb,LEGACY_BILLBOARD_GATES,'Challan Billboard','Challan Billboards')];
  if(sg.length) programs.push(mk(sg,LEGACY_SIGNAGE_GATES,'Road Safety Signages','Road Safety Signages'));
  return {programs,updates:[],initiatives:[],generatedAt:j.updated};
}
async function loadData(){
  try{
    const res=await fetch(CONFIG.DATA_URL+(CONFIG.DATA_URL.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw 0;const doc=normalizeDoc(await res.json());if(!doc)throw 0;DOC=doc;isLive=true;
  }catch(e){DOC=normalizeDoc(SNAPSHOT)||{programs:[],updates:[],initiatives:[]};isLive=false;}
  fillGates(DOC.programs);
  if(!activeKey||(activeKey!==STORY_KEY&&activeKey!==OTHER_KEY&&activeKey!==FUNNEL_KEY&&!programByKey(activeKey)))
    activeKey=DOC.programs[0]&&DOC.programs[0].key;
}
/* if a gate's final step is Done, treat the whole gate as complete (earlier steps auto-Done) */
function fillGates(programs){
  (programs||[]).forEach(p=>(p.rows||[]).forEach(r=>{
    (p.gates||[]).forEach(g=>{
      const cells=r.steps&&r.steps[g.gate]; if(!cells||!g.steps||!g.steps.length) return;
      if(isDone(cells[g.steps[g.steps.length-1]])) g.steps.forEach(s=>{cells[s]='Done';});
    });
  }));
}

/* animate KPI numbers from 0 → value */
function countUpValues(root){
  (root||document).querySelectorAll(root?'.kpi .value':'#view .kpi .value').forEach(elm=>{
    const raw=elm.textContent.trim(); const m=raw.match(/^(\d[\d,]*)(.*)$/);
    if(!m) return; const target=Number(m[1].replace(/,/g,'')); const suffix=m[2]||'';
    if(!isFinite(target)||target<=0) return;
    const dur=650, t0=performance.now();
    function tick(t){const k=Math.min(1,(t-t0)/dur); const val=Math.round(target*(1-Math.pow(1-k,3)));
      elm.textContent=val.toLocaleString('en-IN')+suffix; if(k<1) requestAnimationFrame(tick);}
    elm.textContent='0'+suffix; requestAnimationFrame(tick);
  });
}

function journeyCard(j){

function rowHtml(r){
  const st=statusOf(r),col=STATUS_COLOR[st],p=toPct(r.progress),d=daysInStage(r.lastUpdate);

    <td class="nowrap">${fmtDate(r.lastUpdate)}</td><td class="remark">${esc(r.remark)||'—'}</td></tr>`;
}

function gateCompletion(rows,prog){
  return (prog.gates||[]).map(g=>{let done=0,tot=0;rows.forEach(r=>{const c=(r.steps&&r.steps[g.gate])||{};g.steps.forEach(s=>{tot++;if(isDone(c[s]))done++;});});return {gate:g.gate,label:(g.gate.split(' · ')[1]||g.gate),pct:tot?Math.round(done/tot*100):0};});
}

/* ===================== CHALLAN FUNNEL — ANALYTICS (per-panel filters) ===================== */
function fbData(){return (DOC&&DOC.funnel&&DOC.funnel.data)?DOC.funnel:FUNNEL_SNAPSHOT;}
const nfmt=n=>Number(n||0).toLocaleString('en-IN');
function crfmt(n){n=Number(n||0);return n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':n>=1e3?'₹'+(n/1e3).toFixed(1)+'K':'₹'+nfmt(n);}
const share=(a,b)=>b?Math.round(a/b*1000)/10:0;
const WIN_LABEL={'24h':'Last 24 hours','3d':'Last 3 days','7d':'Last 7 days','30d':'Last 30 days','all':'All-time'};
const WIN_DAYS={'24h':1,'3d':3,'7d':7,'30d':30,'all':9999};
const VLABEL={PUC_EXPIRED:'PUC expired',INSURANCE_EXPIRED:'Insurance expired',CHALLAN_PENDING:'Challan pending',REPEAT_OFFENDER:'Repeat offender',INTER_STATE_CHALLAN:'Inter-state challan',FITNESS_EXPIRED:'Fitness expired',OVERAGE_VEHICLE:'Overage vehicle',BLACKLIST:'Blacklisted',VEHICLE_TYPE_MISMATCH:'Type mismatch',RC_EXPIRED:'RC expired',NO_SEATBELT:'No seatbelt',NO_HELMET:'No helmet',PHONE_USE:'Phone use',TRIPLE_RIDING:'Triple riding',STOLEN:'Stolen',THEFT_HISTORY:'Theft history',FIR_RECORDED:'FIR recorded',PLATE_TAMPERING:'Plate tampering',VEHICLE_DEFECT:'Vehicle defect',ACCIDENT_PRONE:'Accident prone',MISMATCH:'Plate mismatch',COURT_CASE_PENDING:'Court case'};
const vlabel=k=>VLABEL[k]||String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const prettyClass=s=>String(s).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,c=>c.toUpperCase());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(s){const p=String(s).split('-');return (MON[+p[1]-1]||p[1])+' '+p[0];}

/* ---- per-panel filter state (each chart/table filters independently) ---- */
const PANEL={};
function pstate(id){return PANEL[id]||(PANEL[id]={cam:'ALL',win:'30d'});}
function psetCam(id,v){pstate(id).cam=v;renderPanel(id);}
function psetWin(id,v){pstate(id).win=v;renderPanel(id);}
window.psetCam=psetCam;window.psetWin=psetWin;

/* ---- parameterised aggregators (cam, win) ---- */
function aggFor(cam,win){
  const fd=fbData(), cams=fd.cameras||[];
  const sel=cam==='ALL'?cams.map(c=>c.id):[cam];
  const A={scans:0,alerts:0,intercepted:0,missed:0,pucExpired:0,pendingAmount:0,pendingCount:0,paidCount:0,byType:{},vClass:{},offences:{},ins:{valid:0,expired:0,unknown:0},prev:{scans:0,alerts:0,intercepted:0},resp:[]};
  sel.forEach(id=>{
    const x=((fd.data||{})[id]||{})[win]; if(!x) return;
    A.scans+=x.scans||0; A.alerts+=x.alerts||0; A.intercepted+=x.intercepted||0; A.missed+=x.missed||0; A.pucExpired+=x.pucExpired||0;
    A.pendingAmount=Math.max(A.pendingAmount,x.pendingAmount||0); A.pendingCount=Math.max(A.pendingCount,x.pendingCount||0); A.paidCount=Math.max(A.paidCount,x.paidCount||0);
    Object.entries(x.alertsByType||{}).forEach(([k,v])=>A.byType[k]=(A.byType[k]||0)+v);
    (x.vehicleClass||[]).forEach(b=>A.vClass[b.label]=(A.vClass[b.label]||0)+b.count);
    (x.offences||[]).forEach(o=>A.offences[o.label]=(A.offences[o.label]||0)+o.count);
    (x.docCompliance||[]).forEach(d=>{if(d.type==='insurance'){A.ins.valid+=d.valid||0;A.ins.expired+=d.expired||0;A.ins.unknown+=d.unknown||0;}});
    if(x.avgResponseMin!=null) A.resp.push(x.avgResponseMin);
    const p=x.prev||{}; A.prev.scans+=p.scans||0; A.prev.alerts+=p.alerts||0; A.prev.intercepted+=p.intercepted||0;
  });
  A.actioned=A.intercepted+A.missed;
  A.rate=A.actioned?Math.round(A.intercepted/A.actioned*1000)/10:0;
  A.flagRate=share(A.alerts,A.scans);
  A.avgResponseMin=A.resp.length?Math.round(A.resp.reduce((a,b)=>a+b,0)/A.resp.length):null;
  return A;
}
function trendFor(cam,win){
  const fd=fbData(), sel=cam==='ALL'?(fd.cameras||[]).map(c=>c.id):[cam];
  const m={}; sel.forEach(id=>((fd.trends||{})[id]||[]).forEach(p=>m[p.date]=(m[p.date]||0)+p.count));
  let arr=Object.keys(m).sort().map(d=>({date:d,count:m[d]}));
  const days=WIN_DAYS[win]; if(days<9999) arr=arr.slice(-days);
  return arr;
}
function monthlyFor(cam){
  const fd=fbData(), sel=cam==='ALL'?(fd.cameras||[]).map(c=>c.id):[cam];
  const m={};
  sel.forEach(id=>((fd.monthly||{})[id]||[]).forEach(r=>{
    const o=m[r.month]||(m[r.month]={month:r.month,scans:0,violations:0,intercepted:0,missed:0,challansDetected:0});
    o.scans+=r.scans||0;o.violations+=r.violations||0;o.intercepted+=r.intercepted||0;o.missed+=r.missed||0;o.challansDetected+=r.challansDetected||0;
  }));
  return Object.keys(m).sort().map(k=>m[k]);
}

/* ---- per-panel filter bar ---- */
function panelFilters(id,o){
  o=o||{}; const st=pstate(id), fd=fbData();
  const camOpts=[['ALL','All']].concat((fd.cameras||[]).map(c=>[c.id,c.city]));
  const winOpts=[['24h','24h'],['3d','3d'],['7d','7d'],['30d','30d'],['all','All']];
  let h='<div class="pfilters">';
  if(o.cam!==false) h+='<div class="seg sm">'+camOpts.map(x=>`<button type="button" class="${x[0]===st.cam?'on':''}" onclick="psetCam('${id}','${x[0]}')">${esc(x[1])}</button>`).join('')+'</div>';
  if(o.win!==false) h+='<div class="seg sm">'+winOpts.map(x=>`<button type="button" class="${x[0]===st.win?'on':''}" onclick="psetWin('${id}','${x[0]}')">${esc(x[1])}</button>`).join('')+'</div>';
  return h+'</div>';
}
function fdelta(cur,prev){if(!prev)return '';const d=Math.round((cur-prev)/prev*1000)/10;const up=d>=0;return ` <span class="fdelta ${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(d)}%</span>`;}
function kpiIf(cond,label,value,meta,accent){return cond?`<div class="card"><div class="label">${label}</div><div class="value${accent?' accent':''}">${value}</div><div class="meta">${meta}</div></div>`:'';}

/* ---- panel renderers ---- */

function comparisonTableFor(win){
  const fd=fbData(), cams=fd.cameras||[];
  const cw=cams.map(c=>{const w=((fd.data||{})[c.id]||{})[win]||{}, at=w.alertsByType||{};
    return {name:c.city,scans:w.scans||0,alerts:w.alerts||0,challans:at.CHALLAN_PENDING||0,puc:w.pucExpired||0,ins:at.INSURANCE_EXPIRED||0,intercepted:w.intercepted||0,missed:w.missed||0};});
  const comb={}; ['scans','alerts','challans','puc','ins','intercepted','missed'].forEach(k=>comb[k]=cw.reduce((a,r)=>a+r[k],0));
  const irate=o=>{const act=o.intercepted+o.missed;return act?Math.round(o.intercepted/act*1000)/10:0;};
  const spec=[['Vehicles scanned',o=>nfmt(o.scans)],['Violations detected',o=>nfmt(o.alerts)],['Flag rate',o=>share(o.alerts,o.scans)+'%'],
    ['Challans detected',o=>nfmt(o.challans)],['PUC expired',o=>nfmt(o.puc)],['Insurance expired',o=>nfmt(o.ins)],
    ['Intercepted',o=>nfmt(o.intercepted)],['Missed',o=>nfmt(o.missed)],['Interception rate',o=>irate(o)+'%']];
  const head='<tr><th>Metric</th>'+cw.map(c=>`<th>${esc(c.name)}</th>`).join('')+'<th>Combined</th></tr>';
  const body=spec.map(function(row){return '<tr><td class="mlabel">'+row[0]+'</td>'+cw.map(c=>`<td class="nowrap">${row[1](c)}</td>`).join('')+`<td class="nowrap mcomb">${row[1](comb)}</td></tr>`;}).join('');
  return `<table class="cmp"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

    <section><div class="sectitle">Vehicle &amp; document analysis</div><div class="charts"><div class="row2"><div id="panel-class" class="panel"></div><div id="panel-compliance" class="panel"></div></div></div></section>
    <section><div class="sectitle">Offences</div><div id="panel-offence" class="panel"></div></section>
    <section><div class="sectitle">Month-on-month</div><div id="panel-month" class="panel"></div></section>
    <section><div class="sectitle">Camera comparison</div><div id="panel-compare" class="panel"></div></section>`;
  FUNNEL_PANELS.forEach(renderPanel);
}
/* ===================== CHARTS ===================== */
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function buildCharts(rows,prog){
  destroyCharts();
  if(typeof Chart==='undefined'||!rows.length)return;
  Chart.defaults.font.family="'Geist',sans-serif";Chart.defaults.color='#6B6B86';
  const sorted=rows.slice().sort((a,b)=>toPct(b.progress)-toPct(a.progress));
  charts.progress=new Chart(document.getElementById('cProgress'),{type:'bar',
    data:{labels:sorted.map(r=>r.city),datasets:[{label:'Progress %',data:sorted.map(r=>toPct(r.progress)),backgroundColor:sorted.map(r=>phaseColor(r.phase)),borderRadius:5,borderSkipped:false,maxBarThickness:20}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x}% · ${sorted[c.dataIndex].phase}`}}},scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},y:{grid:{display:false}}}}});
  const present=PHASE_ORDER.filter(ph=>rows.some(r=>r.phase===ph));
  rows.forEach(r=>{if(!present.includes(r.phase))present.push(r.phase);});
  charts.dist=new Chart(document.getElementById('cDist'),{type:'doughnut',
    data:{labels:present,datasets:[{data:present.map(ph=>rows.filter(r=>r.phase===ph).length),backgroundColor:present.map(phaseColor),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',padding:11,boxWidth:8,font:{size:11}}}}}});
  const gc=gateCompletion(rows,prog);
  charts.gate=new Chart(document.getElementById('cGate'),{type:'bar',
    data:{labels:gc.map(g=>g.label),datasets:[{label:'% items done',data:gc.map(g=>g.pct),backgroundColor:gc.map((_,i)=>CYCLE[i%CYCLE.length]),borderRadius:5,borderSkipped:false,maxBarThickness:60}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>gc[c[0].dataIndex].gate,label:c=>` ${c.parsed.y}% of checklist done`}}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#ECECF4'}},x:{grid:{display:false}}}}});
}

/* ===================== EVENTS / INIT ===================== */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b||b.dataset.tab===activeKey)return;activeKey=b.dataset.tab;render(true);});
document.getElementById('refreshBtn').addEventListener('click',async()=>{const b=document.getElementById('refreshBtn');b.style.opacity='.5';b.style.pointerEvents='none';await loadData();render(true);b.style.opacity='';b.style.pointerEvents='';});
document.getElementById('refMin').textContent=Math.round(CONFIG.REFRESH_SECONDS/60);
(async function init(){await loadData();render(true);if(timer)clearInterval(timer);timer=setInterval(async()=>{await loadData();render(false);},CONFIG.REFRESH_SECONDS*1000);})();
</script>
